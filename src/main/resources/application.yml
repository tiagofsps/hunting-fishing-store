spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hunting_fishing_store
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  application:
    name: hunting-fishing-store

  profiles:
    active: dev

app:
  jwt:
    secret: ${JWT_SECRET_KEY:local-development-secret-change-me-please}
    expiration: ${JWT_EXPIRATION:15m}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}

