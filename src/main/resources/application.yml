spring:
  application:
    name: hunting-fishing-store

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hunting_fishing_store}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}

app:
  jwt:
    secret: ${JWT_SECRET_KEY:}
    access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
  security:
    cookie:
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:900}
  shipping:
    free-threshold: ${SHIPPING_FREE_THRESHOLD:75}
    fee: ${SHIPPING_FEE:4.95}
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
  mail:
    from: ${MAIL_FROM:}
  payment:
    gateway: ${PAYMENT_GATEWAY:stub}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:local-webhook-secret-change-me}
    checkout-base-url: ${PAYMENT_CHECKOUT_BASE_URL:http://localhost:5173}
    multibanco:
      entity: ${PAYMENT_MULTIBANCO_ENTITY:21345}
      expiry-hours: ${PAYMENT_MULTIBANCO_EXPIRY_HOURS:48}
    expiry-cron: ${PAYMENT_EXPIRY_CRON:0 0 * * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true