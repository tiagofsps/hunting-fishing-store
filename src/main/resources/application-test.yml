spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    driver-class-name: org.postgresql.Driver
    username: test
    password: test
    hikari:
      maximum-pool-size: 2
      minimum-idle: 2
      idle-timeout: 1000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: localhost
      port: 6379

  main:
    allow-bean-definition-overriding: true

app:
  jwt:
    secret: test-secret-change-me-please-at-least-32-chars
  security:
    cookie:
      secure: false
